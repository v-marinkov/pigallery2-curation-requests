services:
  pigallery2:
    image: bpatrik/pigallery2:latest
    container_name: ${PG2_CONTAINER_NAME}
    environment:
      NODE_ENV: production
    volumes:
      - "${PG2_CONFIG_DIR}:/app/data/config"
      - "${PG2_DATABASE_DIR}:/app/data/db"
      - "${PG2_TEMP_DIR}:/app/data/tmp"
      - "${PG2_CURATION_DIR}:/app/data/curation"
      - "${PG2_PHOTO_LIBRARY}:/app/data/images:ro"
      - "${PG2_CUSTOM_ASSETS_DIR}/custom-scripts.js:/app/dist/en/custom-scripts.js:ro"
    ports:
      - "${PG2_HTTP_PORT}:80"
    restart: unless-stopped

    # Add another read-only custom-scripts.js mount for every enabled locale,
    # changing only the /app/dist/<locale>/ destination.
