name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Validate shell scripts
        run: bash -n install.sh deploy-to-server.sh cli/pg2-curation-delete cli/pg2-curation-review

      - name: Run test suite
        run: npm test

      - name: Verify generated JavaScript is current
        run: git diff --exit-code
